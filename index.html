
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>Certificate Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            position: fixed;
            inset: 0;
        }
    </style>
</head>

<body>

    <iframe
        src="https://certificates.freedev.app/"
        title="Certificate Portal"
        allow="clipboard-read; clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

</body>
</html>
